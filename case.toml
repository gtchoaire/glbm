[domain]
n_size = 512
aspect_ratio = 1

[simulation]
num_gpus = 2
steps = 1000000
print_interval = 1000
precision = "float"

[physics]
reynolds_number = 10000.0
u_max = 0.0256

[lattice]
stencil = "D3Q27"
reconstruction_order = 2

[cuda]
block_x = 64
block_y = 4
block_z = 1

[output]
vti = false
interval = 100000

binary = false
binary_interval = 100000

kinetic_energy = false
kinetic_energy_interval = 5000

[checkpoint]
checkpoint_interval = 1000000
checkpoint_path = "checkpoint.glbm"
# To resume, use e.g. "output/yyyymmdd_hhmm/checkpoint.glbm".
restart_path = ""

