name: gpu-sim

# Optional check. The hosted runners have no GPU, so this builds the
# bmbc_statistics test and runs it on a simulated NVIDIA H100
# (https://github.com/pantheongpu/pantheonsim). A simulator cannot reproduce
# hardware-specific behavior or timing, so it complements runs on real GPUs.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "include/**"
      - "tests/**"
      - "CMakeLists.txt"
      - "case.toml"
      - ".github/workflows/gpu-sim.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gpu:
    name: bmbc_statistics (CUDA 13.0 and simulated H100)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Set up the simulated GPU and CUDA toolkit
        uses: pantheongpu/setup-pantheonsim@deff5781e8adfd83dec98dd5242dcbc96a564773 # v0.1.10
        with:
          gpu: nvidia/h100
          cuda-toolkit: "13.0"

      # Passing the architecture skips the nvidia-smi detection. The simulator
      # runs PTX only and needs a shared CUDA runtime.
      - name: Configure and build
        run: |
          vgpu run --preload cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CUDA_ARCHITECTURES=90-virtual \
            -DCMAKE_CUDA_RUNTIME_LIBRARY=Shared
          vgpu run --preload cmake --build build -j3 --target bmbc_statistics_test

      # The test checks the device BMBC statistics against closed-form values
      # and exits non-zero on a mismatch. The guard also fails the job on a
      # simulator error, a missing device or a skipped test, and requires a
      # launch of the statistics kernel.
      - name: Run bmbc_statistics on the simulated GPU
        run: |
          set -o pipefail
          vgpu run --counters ./build/bmbc_statistics_test 2>&1 | tee test.log
          if grep -Eiq 'VirtualGPU error|no (usable )?(cuda )?device|skipped|failed|unexpected' test.log; then
            echo "::error::GPU error, missing device, skipped or failed test in the output"; exit 1
          fi
          # --counters prints one line per simulated kernel launch.
          grep -F '[vgpu][counters]' test.log | grep -Fq gpuComputeBMBCStatistics \
            || { echo "::error::no launch of gpuComputeBMBCStatistics"; exit 1; }
