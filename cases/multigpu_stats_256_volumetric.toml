# Volumetric-only benchmark: ten double-precision temporal averages.

[domain]
n_size = 256
aspect_ratio = 1

[simulation]
num_gpus = 2
steps = 2048
print_interval = 2048
precision = "float"

[physics]
reynolds_number = 3200.0
u_max = 0.0256

[lattice]
stencil = "D3Q27"
reconstruction_order = 2

[statistics]
enabled = true
start_t_star = 0.0
end_t_star = 1.0
sample_interval = 16

[cuda]
block_x = 64
block_y = 1
block_z = 8

[output]
vti = false
interval = 2048
binary = false
binary_interval = 2048
kinetic_energy = false
kinetic_energy_interval = 2048

[checkpoint]
checkpoint_interval = 0
checkpoint_path = "checkpoint_multigpu_stats.glbm"
restart_path = ""

[bmbc]
bmbc_enabled = false
bmbc_sample_interval = 16
bmbc_block_samples = 128
bmbc_initial_capacity_blocks = 8
bmbc_report_interval_blocks = 0
