# Short deterministic validation case.  This is not a production physics case:
# the small BMBC blocks deliberately exercise block completion, history growth,
# checkpointing and multi-GPU profile merging in a few seconds.

[domain]
n_size = 64
aspect_ratio = 1

[simulation]
num_gpus = 1
steps = 4096
print_interval = 1024
precision = "float"

[physics]
reynolds_number = 3200.0
u_max = 0.0256

[lattice]
stencil = "D3Q27"
reconstruction_order = 2

[statistics]
enabled = true
start_t_star = 0.0
end_t_star = 2.0
sample_interval = 1

[cuda]
block_x = 64
block_y = 1
block_z = 8

[output]
vti = false
interval = 4096

binary = true
binary_interval = 4096

kinetic_energy = true
kinetic_energy_interval = 1024

[checkpoint]
checkpoint_interval = 2048
checkpoint_path = "checkpoint_multigpu_validation.glbm"
restart_path = ""

[bmbc]
bmbc_enabled = true
bmbc_sample_interval = 1
bmbc_block_samples = 64
bmbc_initial_capacity_blocks = 8
bmbc_report_interval_blocks = 16
