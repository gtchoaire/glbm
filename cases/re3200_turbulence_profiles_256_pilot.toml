# First scientific pilot for RMS and Reynolds-shear centerline profiles.
# 120 t* transient + 100 t* sampling, two GPUs, no volumetric averages.

[domain]
n_size = 256
aspect_ratio = 1

[simulation]
num_gpus = 2
steps = 2191407
print_interval = 10000
precision = "float"

[physics]
reynolds_number = 3200.0
u_max = 0.0256

[lattice]
stencil = "D3Q27"
reconstruction_order = 2

[statistics]
enabled = false
start_t_star = 120.0
end_t_star = 220.0
sample_interval = 16

[cuda]
block_x = 64
block_y = 1
block_z = 8

[output]
vti = false
interval = 2191407
binary = false
binary_interval = 2191407
kinetic_energy = true
kinetic_energy_interval = 25000

[checkpoint]
checkpoint_interval = 250000
checkpoint_path = "checkpoint_re3200_turbulence_256_pilot.glbm"
restart_path = ""

[bmbc]
bmbc_enabled = true
bmbc_sample_interval = 16
bmbc_block_samples = 128
bmbc_initial_capacity_blocks = 512
bmbc_report_interval_blocks = 64
